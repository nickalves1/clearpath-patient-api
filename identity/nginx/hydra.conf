server {
    listen 80;
    server_name hydra.clearpath.fitleads.com.br;

    location / {
        proxy_pass http://127.0.0.1:4444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hydra's admin API (port 4445) has no auth of its own, so it's never
    # exposed directly - only reachable through here, gated by a shared
    # secret from /clearpath/identity/hydra-admin-secret in SSM. Replace
    # __HYDRA_ADMIN_SECRET__ with that value when applying this file.
    location /admin/ {
        if ($http_x_admin_secret != "__HYDRA_ADMIN_SECRET__") {
            return 403;
        }
        proxy_pass http://127.0.0.1:4445;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
