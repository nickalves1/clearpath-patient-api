version: v1.1.0

cookies:
  same_site: None

serve:
  public:
    base_url: https://kratos.clearpath.fitleads.com.br/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
      allowed_methods:
        - GET
        - POST
      allowed_headers:
        - Content-Type
        - Cookie
      exposed_headers:
        - Set-Cookie
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://localhost:3000/
  allowed_return_urls:
    - http://localhost:3000
  methods:
    password:
      enabled: true
  flows:
    registration:
      enabled: true
    logout:
      after:
        default_browser_return_url: http://localhost:3000/