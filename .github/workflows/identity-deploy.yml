name: Deploy Identity

on:
  push:
    branches:
      - master
    paths:
      - 'identity/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: auth AWS by OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::882034443824:role/clearpath-patient-api-github-actions
          aws-region: us-east-1

      - name: deploy via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=clearpath-identity" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Could not find a running instance tagged Name=clearpath-identity"
            exit 1
          fi

          echo "Deploying to $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/clearpath-patient-api && git pull origin master && bash identity/deploy.sh"]' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          # aws ssm wait command-executed gives up after ~100s, but a fresh
          # image pull + container recreate can take longer than that - poll
          # manually instead, up to 5 minutes.
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
            echo "[$i] Status: $STATUS"
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then
              break
            fi
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed"
            exit 1
          fi
